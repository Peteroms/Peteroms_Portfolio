backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads" # Where uploaded images go
public_folder: "/images/uploads"

collections:
  # About Section
  - name: "about"
    label: "About Section"
    files:
      - file: "index.html"
        label: "About Content"
        name: "about"
        fields:
          - { label: "About Text", name: "about_text", widget: "text" }

  # Portfolio Items
  - name: "portfolio"
    label: "Portfolio Items"
    folder: "content/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Project Link", name: "link", widget: "string" }

  # Contact Info
  - name: "contact"
    label: "Contact Section"
    files:
      - file: "index.html"
        label: "Contact Info"
        name: "contact"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
